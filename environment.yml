# FrED-MOBO environment.
#
# Miniforge, not Anaconda: Anaconda's terms require a paid licence above 200 employees with a
# narrow academic carve-out, so the default channel is blocked at many institutions.
#
# BoTorch stopped publishing to the official `pytorch` conda channel after v0.12, so BoTorch and
# its GP stack are installed with pip *inside* the conda env. Never `sudo pip`, never into base.
#
#   conda env create -f environment.yml
#   conda activate fred-mobo
#   python -c "import botorch; print(botorch.__version__)"   # expect 0.18.1
#
# Versions below are the ones this project is developed and tested against (verified 21 Sep 2026).
name: fred-mobo

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip

  - pip:
      # --- GP / BO stack. §8 of the architecture record was verified against BoTorch 0.18.1;
      #     re-verify every signature against the installed version before use. ---
      - torch==2.13.0
      - botorch==0.18.1
      - gpytorch==1.15.2
      - linear_operator==0.6.1

      # --- numerics and data ---
      - numpy==2.5.1
      - pandas==3.0.5
      - scipy==1.18.0

      # --- plotting (Matplotlib QtAgg canvases in the UI, M8) ---
      - matplotlib==3.11.1

      # --- UI, milestone M8 only. Uncomment when M8 starts; see docs/DECISIONS.md D4. ---
      # - PySide6==6.8.*

      # --- tests ---
      - pytest==9.1.1
